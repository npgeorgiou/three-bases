<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Three Bases: the wheel axes</title>
<style>
:root{--bg:#f6f4ef;--ink:#222;--mute:#777;--line:#d6d1c6;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}.seg button{border:1px solid var(--line);background:var(--card);padding:5px 12px;cursor:pointer}
.seg button.on{background:#222;color:#fff}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
main{display:grid;grid-template-columns:270px 1fr 300px;gap:14px;padding:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:2px 0 8px}
#facs{max-height:78vh;overflow:auto}.game{margin-bottom:8px}.game b{display:flex;justify-content:space-between;align-items:center}
.game b span{font-weight:400;font-size:12px}.game b a{cursor:pointer;color:#36c;margin-left:6px}
label.f{display:flex;align-items:center;gap:6px;padding:1px 0 1px 4px;cursor:pointer}label.f.off{color:#bbb}
.sw{width:11px;height:11px;border-radius:2px;flex:none}label.f small{color:var(--mute);margin-left:auto}
svg text{font-size:11px;fill:#444}.spoke-label{cursor:help}.spoke-label.off{fill:#ccc}
#tip{position:fixed;pointer-events:none;background:#222;color:#fff;padding:6px 8px;border-radius:5px;font-size:12px;max-width:340px;display:none;z-index:9}
#axes label{display:block;font-size:12.5px;cursor:pointer}#near ol{margin:4px 0 0 18px;padding:0}
select{width:100%;padding:4px}.note{font-size:12px;color:var(--mute)}
table{border-collapse:collapse;font-size:12px;width:100%}th,td{padding:3px 5px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}
th{cursor:pointer;position:sticky;top:0;background:#fff}td:first-child,th:first-child{text-align:left}
#tablewrap{max-height:60vh;overflow:auto;margin-top:8px}.tabs{margin:0 0 8px}
</style></head><body>
<header><h1>The wheel axes, measured on the library</h1>
<div class="seg" id="mode"><button data-m="cards" class="on">All cards</button><button data-m="decks">Cards in top decks</button></div>
<div class="seg" id="view"><button data-v="radar" class="on">Circle of axes</button><button data-v="map">Map of factions</button><button data-v="table">Numbers</button></div>
<span class="note" id="count"></span></header>
<main>
<div class="panel"><h2>Factions</h2><div style="margin-bottom:6px"><a href="#" id="allOn">all</a> · <a href="#" id="allOff">none</a></div><div id="facs"></div></div>
<div class="panel" id="centre"><div id="radarBox"></div><div id="mapBox" style="display:none"></div><div id="tableBox" style="display:none"></div>
<p class="note" id="explain"></p></div>
<div><div class="panel" id="near"><h2>Closest factions</h2><select id="nearSel"></select><ol id="nearList"></ol>
<p class="note">Distance over the axes ticked below, in the mode above.</p></div>
<div class="panel" id="axes" style="margin-top:14px"><h2>Axes shown</h2><div id="axList"></div></div></div>
</main><div id="tip"></div>

 for(const id of sel){const f=F[id];if(!has(f))continue;const z=Z(f),r=R(f);
  const pts=ax.map((a,i)=>{const v=z[a.key]==null?0:z[a.key];return[C+Math.cos(ang(i))*rad(v),C+Math.sin(ang(i))*rad(v)]});
  const pg=el('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:f.col,'fill-opacity':.08,stroke:f.col,'stroke-width':2},svg);
  pg.onmousemove=e=>showTip(e,`<b>${f.faction}</b> (${f.game})`);pg.onmouseleave=hideTip;
  ax.forEach((a,i)=>{const c=el('circle',{cx:pts[i][0],cy:pts[i][1],r:4,fill:f.col},svg);
   c.onmousemove=e=>showTip(e,`<b>${f.faction}</b> (${f.game})<br>${a.n}. ${a.label}<br>Scale: ${z[a.key]==null?'–':(z[a.key]>=0?'+':'')+z[a.key].toFixed(2)} (0 = average of its game)<br>${fmtRaw(a,r[a.key])}`);c.onmouseleave=hideTip})}
 document.getElementById('explain').innerHTML='Each spoke is one axis. The dashed ring is the average faction of its own game (0). Each ring outward or inward is one step of spread (1 standard deviation over all factions). Outward = the end written at the spoke tip; inward = the end written near the centre. Hover a spoke name to see which library concepts measure it (my choice of concepts), hover a dot for the numbers.'}

function vec(f){return A.filter(a=>axOn.has(a.key)).map(a=>{const v=Z(f)[a.key];return v==null?0:v})}
function pca(X){const n=X.length,d=X[0].length,m=Array(d).fill(0);X.forEach(r=>r.forEach((v,j)=>m[j]+=v/n));const Y=X.map(r=>r.map((v,j)=>v-m[j]));
 const Cv=Array.from({length:d},()=>Array(d).fill(0));Y.forEach(r=>{for(let i=0;i<d;i++)for(let j=0;j<d;j++)Cv[i][j]+=r[i]*r[j]/n});
 const tot=Cv.reduce((s,r,i)=>s+r[i],0),comps=[],vals=[];let M=Cv.map(r=>r.slice());
 for(let k=0;k<Math.min(6,d);k++){let v=Array(d).fill(0).map((_,i)=>Math.sin(i+1+k));for(let it=0;it<300;it++){const w=M.map(r=>r.reduce((s,x,j)=>s+x*v[j],0));const nn=Math.hypot(...w)||1;v=w.map(x=>x/nn)}
  const lam=v.reduce((s,x,i)=>s+x*M[i].reduce((t,y,j)=>t+y*v[j],0),0);comps.push(v);vals.push(lam);M=M.map((r,i)=>r.map((x,j)=>x-lam*v[i]*v[j]))}
 return{proj:Y.map(r=>comps.slice(0,2).map(c=>r.reduce((s,x,j)=>s+x*c[j],0))),share:vals.map(l=>l/tot),comps}}
function map(){const box=document.getElementById('mapBox');box.innerHTML='';const fs=F.filter(has);const ax=A.filter(a=>axOn.has(a.key));if(ax.length<2||fs.length<3)return;
 const P=pca(fs.map(vec)),W=760,C=W/2;const mx=Math.max(...P.proj.flat().map(Math.abs))||1,s=320/mx;
 const svg=el('svg',{viewBox:`0 0 ${W} ${W}`,width:'100%'},box);el('circle',{cx:C,cy:C,r:300,fill:'none',stroke:'#e4e0d6'},svg);
 el('line',{x1:C-330,y1:C,x2:C+330,y2:C,stroke:'#eee'},svg);el('line',{x1:C,y1:C-330,x2:C,y2:C+330,stroke:'#eee'},svg);
 const lead=c=>c.map((v,j)=>[v,ax[j]]).sort((p,q)=>Math.abs(q[0])-Math.abs(p[0])).slice(0,3).map(([v,a])=>(v>0?a.hi:(a.lo||'not '+a.hi))).join(', ');
 const t1=el('text',{x:W-10,y:C-6,'text-anchor':'end'},svg);t1.textContent='→ '+lead(P.comps[0]);const t0=el('text',{x:10,y:C-6},svg);t0.textContent=lead(P.comps[0].map(v=>-v))+' ←';
 const t2=el('text',{x:C+6,y:14},svg);t2.textContent='↑ '+lead(P.comps[1].map(v=>-v));const t3=el('text',{x:C+6,y:W-6},svg);t3.textContent='↓ '+lead(P.comps[1]);
 fs.forEach((f,i)=>{const[x,y]=P.proj[i];const on=sel.has(f.id);const c=el('circle',{cx:C+x*s,cy:C+y*s,r:on?7:5,fill:on?f.col:GCOL[f.game],'fill-opacity':on?1:.45,stroke:on?'#222':'none',style:'cursor:pointer'},svg);
  c.onmousemove=e=>showTip(e,`<b>${f.faction}</b> (${f.game})<br>click to show or hide on the circle`);c.onmouseleave=hideTip;c.onclick=()=>{on?sel.delete(f.id):sel.add(f.id);buildFacs();draw()};
  if(on){const t=el('text',{x:C+x*s+9,y:C+y*s+4},svg);t.textContent=f.faction}});
 GAMES.forEach((g,i)=>{el('circle',{cx:16,cy:W-14-i*16,r:5,fill:GCOL[g],'fill-opacity':.6},svg);const t=el('text',{x:26,y:W-10-i*16},svg);t.textContent=g.replace(/_/g,' ')});
 const cum=[];P.share.reduce((a,v)=>(cum.push(a+v),a+v),0);
 document.getElementById('explain').innerHTML=`Every faction as one point, placed by the two directions in which the factions differ most (a principal component analysis of the ticked axes). Faded colours = game; selected factions are bold and named. Click a point to select it. These two directions hold ${Math.round(cum[1]*100)}% of all the differences between factions; the first six hold ${Math.round((cum[5]||cum[cum.length-1])*100)}%. The rest is lost on a flat picture, which is why factions close here can still differ on axes not shown.`}

let sortK='faction',sortD=1;
function table(){const box=document.getElementById('tableBox');const ax=A.filter(a=>axOn.has(a.key));const fs=F.filter(has).filter(f=>!sel.size||sel.has(f.id));
 const val=(f,k)=>k==='faction'?f.faction:k==='game'?f.game:(Z(f)[k]??-99);fs.sort((p,q)=>{const a=val(p,sortK),b=val(q,sortK);return(a>b?1:a<b?-1:0)*sortD});
 box.innerHTML=`<div id="tablewrap"><table><tr><th data-k="faction">Faction</th><th data-k="game">Game</th>${ax.map(a=>`<th data-k="${a.key}" title="${a.label}">${a.n}. ${a.hi}</th>`).join('')}</tr>`+
  fs.map(f=>`<tr><td>${f.faction}</td><td>${f.game.replace(/_/g,' ')}</td>${ax.map(a=>{const v=Z(f)[a.key];const c=v==null?'':v>0?`rgba(220,90,40,${Math.min(.6,v/3)})`:`rgba(40,110,220,${Math.min(.6,-v/3)})`;return`<td style="background:${c}" title="${fmtRaw(a,R(f)[a.key])}">${v==null?'–':v.toFixed(1)}</td>`}).join('')}</tr>`).join('')+'</table></div>';
 box.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortD=sortK===k?-sortD:(k==='faction'||k==='game'?1:-1);sortK=k;table()});
 document.getElementById('explain').innerHTML='Scale per axis: 0 = average faction of its own game, +1 = one step of spread toward the end in the header. Selected factions only (all when none is selected). Click a header to sort, hover a cell for the raw number.'}

function near(){const s=document.getElementById('nearSel');const f=F[s.value];const ol=document.getElementById('nearList');if(!f||!has(f)){ol.innerHTML='';return}
 const v=vec(f);const d=F.filter(g=>has(g)&&g.id!==f.id).map(g=>[g,Math.sqrt(vec(g).reduce((a,x,i)=>a+(x-v[i])**2,0))]).sort((a,b)=>a[1]-b[1]).slice(0,8);
 ol.innerHTML=d.map(([g,x])=>`<li>${g.faction} <span class="note">(${g.game.replace(/_/g,' ')}, ${x.toFixed(1)})</span></li>`).join('')}
document.getElementById('nearSel').onchange=near;
function draw(){document.getElementById('radarBox').style.display=view==='radar'?'':'none';document.getElementById('mapBox').style.display=view==='map'?'':'none';document.getElementById('tableBox').style.display=view==='table'?'':'none';
 view==='radar'?radar():view==='map'?map():table()}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));for(const id of[...sel])if(!has(F[id]))sel.delete(id);buildFacs();draw()});
document.querySelectorAll('#view button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('#view button').forEach(x=>x.classList.toggle('on',x===b));draw()});
document.getElementById('allOn').onclick=e=>{e.preventDefault();F.filter(has).forEach(f=>sel.add(f.id));buildFacs();draw()};
document.getElementById('allOff').onclick=e=>{e.preventDefault();sel.clear();buildFacs();draw()};
F.filter(has).slice(0,3).forEach(f=>sel.add(f.id));buildFacs();buildAxes();draw();
</script></body></html>
