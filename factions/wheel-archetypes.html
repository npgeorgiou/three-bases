const pick=document.getElementById('pick'),svg=document.getElementById('map'),side=document.getElementById('side');
const NS='http://www.w3.org/2000/svg',nm=c=>D.names[c]||c;
pick.innerHTML='<option value="*">All archetypes</option>'+Object.entries(D.archetypes).map(([k,a])=>`<option value="${k}">${a.name}</option>`).join('');
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function draw(){
  const key=pick.value,arch=key==='*'?Object.keys(D.archetypes):[key];
  const kind={},edges=D.edges.filter(e=>arch.includes(e.arch));
  for(const k of arch)for(const p of D.archetypes[k].parts)for(const c of p.concepts)if(kind[c]!=='engine')kind[c]=p.kind;
  const nodes=Object.keys(kind).sort((a,b)=>kind[a]===kind[b]?a.localeCompare(b):kind[a]==='engine'?-1:1),pos={};
  const R=nodes.length>40?380:330;nodes.forEach((c,i)=>{const t=2*Math.PI*i/nodes.length;pos[c]=[550+R*Math.cos(t),550+R*Math.sin(t),t]});
  svg.innerHTML='';const seen=new Set(),lines=[];
  for(const e of edges){const id=[e.a,e.b].sort().join('|');if(seen.has(id))continue;seen.add(id);
    const w=Math.max(.6,Math.min(8,Math.log2(1+Math.max(+e.cards||0,+e.decks||0))*1.6));
    const l=el('line',{'stroke-dasharray':e.note?'4 4':'',x1:pos[e.a][0],y1:pos[e.a][1],x2:pos[e.b][0],y2:pos[e.b][1],'stroke-width':w});
    l.dataset.a=e.a;l.dataset.b=e.b;l.append(el('title',{}));l.firstChild.textContent=`${nm(e.a)} — ${nm(e.b)}\n${e.cards||'-'}x chance in cards, ${e.decks||'-'}x in decks, ${e.games} games\n${e.text}\n${e.pair}`;
    svg.append(l);lines.push(l)}
  for(const c of nodes){const [x,y,t]=pos[c],ci=el('circle',{cx:x,cy:y,r:6,fill:kind[c]==='engine'?'#1f6f8b':'#8b5a1f'});
    ci.append(el('title',{}));ci.firstChild.textContent=nm(c);
    ci.onclick=()=>lines.forEach(l=>l.classList.toggle('hi',l.dataset.a===c||l.dataset.b===c));svg.append(ci);
    const right=Math.cos(t)>=0,deg=t*180/Math.PI+(right?0:180),tx=el('text',{x:x+(right?10:-10),y:y+4,'text-anchor':right?'start':'end',transform:`rotate(${deg} ${x} ${y})`});
    tx.textContent=nm(c).replace(/ \(.*\)$/,'');svg.append(tx)}
  let h='';
  if(key!=='*'){const a=D.archetypes[key];h+=`<h3>${esc(a.name)}</h3><p>${esc(a.what)}.</p>`;
    for(const p of a.parts)h+=`<div class="part"><b class="${p.kind}">${esc(p.part)} (${p.kind})</b>${p.concepts.map(nm).map(esc).join('; ')}</div>`}
  h+=`<p class="note">${nodes.length} concepts, ${seen.size} lines.</p><table><tr><th>concepts</th><th>x chance (cards / decks)</th><th>games</th><th>real link and card pair</th></tr>`;
  for(const e of edges.slice().sort((x,y)=>y.cards-x.cards))h+=`<tr><td>${esc(nm(e.a))} — ${esc(nm(e.b))}${key==='*'?'<br><span class="note">'+esc(D.archetypes[e.arch].name)+'</span>':''}</td><td>${e.cards||'-'} / ${e.decks||'-'}</td><td>${e.games}</td><td>${esc(e.text)}<br><span class="note">${esc(e.pair||'no card pair: only real decks hold them together')}</span>${e.note?'<br><b class="weak">weak: '+esc(e.note)+'</b>':''}</td></tr>`;
  side.innerHTML=h+'</table>'}
pick.onchange=draw;draw();
</script></body></html>
