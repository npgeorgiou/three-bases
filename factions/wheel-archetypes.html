.big{font-size:13px;margin:2px 0}
.weak{color:#b23a48}
details{margin:4px 0}summary{cursor:pointer;color:#555;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:2px}
td,th{border-bottom:1px solid #eee;padding:3px 4px;text-align:left;vertical-align:top}
th{background:#f3f2ee;font-weight:600}
.note{color:#777;font-size:11px}
svg text{font-size:10px;pointer-events:none;fill:#9a9a9a}
svg text.on{fill:#222;font-weight:600}

  if(!t.shared.length)return `<h2>The two as one faction</h2><p class="big weak">They share no concept, so they can't be one faction (step 6).</p>`;
  const syn=[];for(let i=0;i<t.all.length;i++)for(let j=i+1;j<t.all.length;j++){const l=linkOf[[t.all[i],t.all[j]].sort().join('|')];if(strong(l))syn.push(l)}
  syn.sort((x,y)=>(+y.cards||0)-(+x.cards||0));
  return `<h2>The two as one faction</h2><p class="big">Score <b>${t.score.toFixed(2)}</b> · number ${rank} of ${ALLPAIRS.length} pairs · ${t.all.length} concepts · ${t.n} strong links between the two · they share ${t.shared.map(c=>esc(short(c))).join(', ')}</p>
  <div class="chips">${t.all.map(c=>`<span class="chip">${esc(short(c))}</span>`).join('')}${marks([a,b])}</div><h3>Its synergies (${syn.length})</h3>${table(syn,false)}`}
function bestPairs(){const ps=[];for(let i=0;i<picked.length;i++)for(let j=i+1;j<picked.length;j++){const t=together(picked[i],picked[j]);
    ps.push([picked[i],picked[j],t.shared.length?t.score:0,t.shared.length?ALLPAIRS.findIndex(s=>s<=t.score)+1:'shares nothing'])}
  ps.sort((x,y)=>y[2]-x[2]);
  return `<h2>Which two fit best as one faction</h2><table><tr><th>the two archetypes</th><th>score</th><th>rank of ${ALLPAIRS.length}</th></tr>${ps.map(([a,b,s,r])=>`<tr><td>${esc(D.archetypes[a].name)}<br>${esc(D.archetypes[b].name)}</td><td>${s.toFixed(2)}</td><td>${r}</td></tr>`).join('')}</table>
  <p class="help">Untick the others to see one pair as a faction.</p>`}
function built(){if(!chosen.size)return '';
  const S=[...chosen],idx=S.map(c=>D.nodes.indexOf(c)),need=Math.ceil(S.length/2);
  const fit=D.decks.filter(d=>idx.filter(i=>d[2].includes(i)).length>=need),games={};
  fit.forEach(d=>games[d[0]]=(games[d[0]]||0)+1);
  const share=(ds,i)=>ds.length?ds.filter(d=>d[2].includes(i)).length/ds.length:0;
  const more=D.nodes.map((c,i)=>[c,share(fit,i),share(D.decks,i)]).filter(x=>!chosen.has(x[0])&&x[1]>x[2]).sort((x,y)=>y[1]-x[1]).slice(0,8);
  const sum=(o,cs)=>cs.reduce((t,c)=>t+(o[c]||0),0),tot=o=>Object.values(o).reduce((t,v)=>t+v,0);
  const facs=D.factions.map(([g,f,cn])=>{const gc=D.gameCounts[g],gs=sum(gc,S)/tot(gc);return [g,f,gs?(sum(cn,S)/tot(cn))/gs:0]}).sort((x,y)=>y[2]-x[2]);
  const fits=facs.filter(x=>x[2]>=2),like=keys.map(k=>[k,conc(k).filter(c=>chosen.has(c)).length]).filter(x=>x[1]).sort((x,y)=>y[1]-x[1]).slice(0,3);
  const ng=Object.keys(games).length;
  return `<h2>Your archetype</h2><div class="chips">${S.map(c=>`<span class="chip" style="background:#f1e8f6;color:#7b3fa0">${esc(short(c))}</span>`).join('')}</div>
  <p class="big"><b>Decks:</b> ${fit.length} of ${D.decks.length}, in ${ng} game${ng===1?'':'s'}${ng?' ('+Object.entries(games).sort((x,y)=>y[1]-x[1]).map(([g,n])=>esc(g)+' '+n).join(', ')+')':''}${ng<2?' <span class="weak">· an archetype needs 2+ games</span>':''}</p>
  <p class="big"><b>Factions that fit:</b> ${(fits.length?fits:facs.slice(0,3)).map(([g,f,r])=>esc(f)+' <span class="note">'+esc(g)+' ×'+r.toFixed(1)+'</span>').join(', ')}${fits.length?'':' <span class="note">(nearest; none fits)</span>'}</p>
  <p class="big"><b>Closest agreed archetypes:</b> ${like.map(([k,n])=>esc(D.archetypes[k].name)+' <span class="note">'+n+' shared</span>').join(', ')||'none'}</p>
  <h3>Those decks also lean on</h3><table><tr><th>concept</th><th>these decks</th><th>all decks</th></tr>${more.map(([c,a,b])=>`<tr><td>${esc(short(c))}</td><td>${Math.round(a*100)}%</td><td>${Math.round(b*100)}%</td></tr>`).join('')||'<tr><td colspan="3">none</td></tr>'}</table>`}
const HOW=`<details style="margin-top:16px"><summary>How to read this page</summary><ul class="help" style="padding-left:16px">
<li>Blue concepts are engines (they work by feeding another part of the archetype), grey are bricks (they work alone). Claude chose which is which.</li>
<li>Brown tags are design markers: what the archetype's decks are like (many spells, cheap units, a low curve). They are no concepts and take no faction place; later steps get them.</li>
<li><b>× chance</b>: how many times more often than chance real cards link the two (cards) or real decks hold both (decks). <b>games</b>: in how many of the 10 games such cards exist.</li>
<li>Thicker line = more times chance. Dashed = weak: its main link is about hitting the player, or only real decks hold them. An orange ring: a concept two ticked archetypes share.</li>
<li>Two archetypes can be one faction only when they share at least one concept. <b>Score</b> of two archetypes: strong links between a concept of one and a concept of the other, divided by their different concepts (step 6). A strong link: cards 1.2+, or a rare pairing of 3+.</li>
<li><b>Your archetype</b>: a deck counts when it leans on at least half of the picked concepts (the half is Claude's); a deck leans on a concept when it holds it far more than its game's decks do (step 3). A faction fits when its cards hold the concepts at least twice as much as its game's cards (step 3's rule).</li>
<li>The places: two concepts sit close when the same archetypes' decks lean on them (Claude's way of measuring it).</li></ul></details>`;

draw();
