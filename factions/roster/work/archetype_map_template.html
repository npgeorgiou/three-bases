<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>The roster: map</title>
<style>
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,sans-serif;background:#f6f5f1;color:#222;display:grid;grid-template-columns:300px 1fr 440px;overflow:hidden;user-select:none}
#map{width:100%;height:100vh;background:#fff;cursor:grab;display:block}
#side,#left{height:100vh;display:flex;flex-direction:column;background:#fff;box-sizing:border-box}
#side{border-left:1px solid #ddd}#left{border-right:1px solid #ddd}
#top{padding:6px 10px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px}
#top h1{flex:1;margin:0}
h1{font-size:18px;margin:0 0 2px}h2{font-size:16px;margin:14px 0 4px}h3{font-size:14px;margin:10px 0 2px;color:#555}
.help{color:#666;font-size:14px;margin:2px 0}
.bar{display:flex;gap:6px;margin-top:6px}
button{font-size:14px;padding:3px 10px;cursor:pointer}
#picks{flex:1 1 auto;overflow-y:auto;scrollbar-gutter:stable;padding:0 10px 10px}
.pickbox{border:1px solid #ddd;border-radius:6px;margin:6px 0;padding:4px 10px 6px}
.pickbox.fac{background:#fdf3f3;border-color:#e5b5b5}.pickbox.arc{background:#f2f6f9;border-color:#bcd0de}
.pickbox .grid{display:flex;flex-direction:column}
.chip.clicked{background:#f1e8f6;color:#7b3fa0}
#picks label{display:flex;gap:5px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.3;padding:2px 0}
#picks .sw{flex:0 0 12px;height:12px;border-radius:2px;margin-top:3px;border:1px solid #ccc}
#info{flex:1 1 auto;overflow-y:auto;scrollbar-gutter:stable;padding:4px 14px 20px}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{font-size:13px;padding:1px 7px;border-radius:9px;background:#eef4f7;color:#1f6f8b}
.chip.kernel{background:#fbe5e5;color:#b3261e;font-weight:600}
.chip.brick{background:#eceef1;color:#5d6470}
.chip.extra{background:#fff;color:#5d6470;border:1px dashed #9aa1ab}
#picks h4{margin:2px 0 4px;font-size:15px;color:#333}
.chip.mark{background:#f6efe6;color:#8b5a1f}
.big{font-size:15px;margin:2px 0}
.weak{color:#b23a48}
details{margin:4px 0}summary{cursor:pointer;color:#555;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:2px}
td,th{border-bottom:1px solid #eee;padding:3px 4px;text-align:left;vertical-align:top}
th{background:#f3f2ee;font-weight:600}
.note{color:#777;font-size:13px}
svg text{font-size:12px;pointer-events:none;fill:#9a9a9a}
svg text.on{fill:#222;font-weight:600}
circle{cursor:pointer}
</style></head><body>
<div id="left">
<div id="top"><h1>The roster: map</h1><button id="none">Clear all</button></div>
<div id="picks"></div>
</div>
<svg id="map"></svg>
<div id="side">
<div id="info"></div>
</div>
</div>
<script>
const D=/*DATA*/null;
if(!D){document.body.innerHTML='<p style="padding:20px">This is the page template, with no data. Open <b>factions/roster-map.html</b> (written from it by <code>work/archetype_map.py</code>).</p>';throw new Error('template opened without data')}
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('map'),info=document.getElementById('info');
const nm=c=>D.names[c]||c,short=c=>nm(c).replace(/ \(.*\)$/,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#1f6f8b','#d1495b','#2a9d8f','#8e44ad','#e09f3e','#3d5a80','#6a994e','#c05299'];
const keys=Object.keys(D.archetypes),picked=[];const focus=null;const chosen=new Set();let dragged=false;
const linkOf={};for(const l of D.links)linkOf[[l.a,l.b].sort().join('|')]=l;
const strong=l=>!!l&&((+l.cards||0)>=1.2||((+l.rare||0)>=3&&(+l.level||0)>=1));
const conc=k=>[...new Set(D.archetypes[k].parts.flatMap(p=>p.concepts))];
function together(a,b){const A=conc(a),B=conc(b),all=new Set([...A,...B]),pairs=new Set();
  for(const x of A)for(const y of B)if(x!==y&&strong(linkOf[[x,y].sort().join('|')]))pairs.add([x,y].sort().join('|'));
  return {score:pairs.size/all.size,all:[...all],n:pairs.size,shared:A.filter(x=>B.includes(x))}}
const AK=keys.filter(k=>!D.archetypes[k].faction),FK=keys.filter(k=>D.archetypes[k].faction);
const ALLPAIRS=[];for(let i=0;i<AK.length;i++)for(let j=i+1;j<AK.length;j++){const t=together(AK[i],AK[j]);if(t.shared.length)ALLPAIRS.push(t.score)}
ALLPAIRS.sort((x,y)=>y-x);
const pick=k=>`<label><input type="checkbox" value="${k}"><span class="sw"></span><span>${esc(D.archetypes[k].name)}</span></label>`;
document.getElementById('picks').innerHTML=(FK.length?'<div class="pickbox fac"><h4>The factions (step 6)</h4><div class="grid">'+FK.map(pick).join('')+'</div></div>':'')
  +'<div class="pickbox arc"><h4>What decks play together (step 3)</h4><div class="grid">'+AK.map(pick).join('')+'</div></div>';
document.querySelectorAll('#picks input').forEach(i=>i.onchange=()=>{const k=i.value;
  if(i.checked)picked.push(k);else picked.splice(picked.indexOf(k),1);draw()});
document.getElementById('none').onclick=()=>{picked.length=0;chosen.clear();document.querySelectorAll('#picks input').forEach(i=>i.checked=false);draw()};
let vb=(D.view||[0,0,1000,1000]).slice();const setVB=()=>svg.setAttribute('viewBox',vb.join(' '));setVB();
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),s=Math.min(vb[2]/r.width,vb[3]/r.height),
  x=vb[0]+(e.clientX-r.left)*s,y=vb[1]+(e.clientY-r.top)*s,f=e.deltaY>0?1.15:1/1.15;
  vb=[x-(x-vb[0])*f,y-(y-vb[1])*f,vb[2]*f,vb[3]*f];setVB()},{passive:false});
let drag=null;svg.onmousedown=e=>{e.preventDefault();drag=[e.clientX,e.clientY,vb[0],vb[1]];dragged=false;svg.style.cursor='grabbing'};
window.onmouseup=()=>{drag=null;svg.style.cursor='grab'};
window.onmousemove=e=>{if(!drag)return;if(Math.abs(e.clientX-drag[0])+Math.abs(e.clientY-drag[1])>4)dragged=true;const r=svg.getBoundingClientRect(),s=Math.min(vb[2]/r.width,vb[3]/r.height);
  vb[0]=drag[2]-(e.clientX-drag[0])*s;vb[1]=drag[3]-(e.clientY-drag[1])*s;setVB()};
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e}
function width(l){return Math.max(.8,Math.min(7,Math.log2(1+Math.max(+l.cards||0,+l.decks||0))*1.5))}
function row(l,tag){return `<tr><td><b>${esc(short(l.a))} — ${esc(short(l.b))}</b>${tag?' <span class="note">('+tag+')</span>':''}<div class="note">${esc(l.text)}${l.pair?' · '+esc(l.pair):' · only real decks hold them'}${l.note?' · <span class="weak">weak: '+esc(l.note)+'</span>':''}</div></td><td>${l.cards||'-'} / ${l.decks||'-'}</td><td>${l.games}</td></tr>`}
const TH='<tr><th>the two concepts, how real cards link them</th><th>× chance cards / decks</th><th>games</th></tr>';
function draw(){
  document.querySelectorAll('#picks label').forEach(lb=>{const k=lb.querySelector('input').value,i=picked.indexOf(k);
    lb.querySelector('.sw').style.background=i<0?'transparent':COL[i%COL.length]});
  const uses={},kind={};
  const RANK={kernel:3,engine:2,brick:1,extra:0};
  picked.forEach(k=>D.archetypes[k].parts.forEach(p=>p.concepts.forEach(c=>{(uses[c]=uses[c]||new Set()).add(k);if(!(RANK[kind[c]]>=RANK[p.kind]))kind[c]=p.kind})));
  const lines=[];
  picked.forEach((k,i)=>D.edges.filter(e=>e.arch===k).forEach(e=>lines.push({...e,col:COL[i%COL.length],tag:D.archetypes[k].name})));
  const cross=[];
  for(let i=0;i<picked.length;i++)for(let j=i+1;j<picked.length;j++){
    const A=[...new Set(D.archetypes[picked[i]].parts.flatMap(p=>p.concepts))],B=[...new Set(D.archetypes[picked[j]].parts.flatMap(p=>p.concepts))];
    for(const a of A)for(const b of B){if(a===b||(uses[a].has(picked[j]))||(uses[b].has(picked[i])))continue;
      const l=linkOf[[a,b].sort().join('|')];if(l)cross.push({...l,tag:D.archetypes[picked[i]].name+' with '+D.archetypes[picked[j]].name})}}
  svg.innerHTML='';const P=D.pos,seen=new Set();
  for(const l of [...lines,...cross.map(l=>({...l,col:'#e07a1f',x:1}))]){
    if(focus&&l.a!==focus&&l.b!==focus)continue;
    const id=[l.a,l.b].sort().join('|')+(l.col);if(seen.has(id))continue;seen.add(id);
    const ln=el('line',{x1:P[l.a][0],y1:P[l.a][1],x2:P[l.b][0],y2:P[l.b][1],stroke:l.col,'stroke-opacity':l.x?.55:.7,'stroke-width':width(l),'stroke-dasharray':l.note?'5 4':''});
    const t=el('title',{});t.textContent=`${nm(l.a)} — ${nm(l.b)}\n${l.cards||'-'}x in cards, ${l.decks||'-'}x in decks, ${l.games} games\n${l.text}\n${l.pair}`;ln.append(t);svg.append(ln)}
  for(const c of Object.keys(P)){const on=!!uses[c],n=on?uses[c].size:0,[x,y]=P[c];
    const ci=el('circle',{cx:x,cy:y,r:on?(n>1?8:6):3.5,fill:on?({kernel:'#d1352b',engine:'#1f6f8b'}[kind[c]]||'#7d8590'):'#cfcfcf',stroke:n>1?'#e07a1f':'none','stroke-width':3});
    const t=el('title',{});t.textContent=nm(c);ci.append(t);
    if(chosen.has(c))svg.append(el('circle',{cx:x,cy:y,r:12,fill:'none',stroke:'#7b3fa0','stroke-width':3}));
    svg.append(ci);const hit=el('circle',{cx:x,cy:y,r:11,fill:'transparent'});const ht=el('title',{});ht.textContent=nm(c)+' (click: add to or take out of your pick)';hit.append(ht);
    hit.onclick=e=>{e.stopPropagation();if(dragged)return;chosen.has(c)?chosen.delete(c):chosen.add(c);draw()};
    const tx=el('text',{x:x+8,y:y+3.5,class:on?'on':''});tx.textContent=short(c);svg.append(tx);svg.append(hit)}
  const byLink=(x,y)=>Math.max(+y.cards||0,+y.decks||0)-Math.max(+x.cards||0,+x.decks||0),only=l=>!focus||l.a===focus||l.b===focus;
  let h=built();
  const arch=picked.every(k=>!D.archetypes[k].faction);
  if(arch&&picked.length===2)h+=asFaction(picked[0],picked[1]);
  if(arch&&picked.length>2)h+=bestPairs();
  picked.forEach((k,i)=>{const a=D.archetypes[k];
    h+=`<h2><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${COL[i%COL.length]}"></span> ${esc(a.name)}</h2>
    <div class="chips">${a.parts.map(p=>p.concepts.map(c=>`<span class="chip ${p.kind}">${esc(short(c))}</span>`).join('')).join('')}${marks([k])}</div>`});
  if(picked.length){const L=lines.filter(only).sort(byLink);h+=`<h3>Lines inside ${picked.length>1?'each archetype':'the archetype'} (${L.length})</h3>${table(L,picked.length>1)}`}
  if(picked.length>1){const C=cross.filter(only).sort(byLink);h+=`<h3>Links between the ticked archetypes, orange (${C.length})</h3>${table(C,true)}`}
  if(!h)h='<p class="help" style="margin-top:12px">Tick an archetype, or press "Build an archetype" and click dots.</p>';
  info.innerHTML=h+HOW}
function marks(ks){const m={};ks.forEach(k=>Object.entries(D.archetypes[k].markers||{}).forEach(([x,r])=>m[x]=Math.max(m[x]||0,r)));
  return Object.entries(m).sort((x,y)=>y[1]-x[1]).map(([x,r])=>`<span class="chip mark" title="design marker: its decks have it ${r}x as often">${esc(D.markerNames[x])}</span>`).join('')}
function table(L,tag,n=8){if(!L.length)return '<p class="note">none</p>';
  const r=x=>x.map(l=>row(l,tag?esc(l.tag):'')).join('');
  return `<table>${TH}${r(L.slice(0,n))}</table>`+(L.length>n?`<details><summary>Show all ${L.length}</summary><table>${r(L.slice(n))}</table></details>`:'')}
function asFaction(a,b){const t=together(a,b),rank=ALLPAIRS.findIndex(s=>s<=t.score)+1;
  if(!t.shared.length)return `<h2>The two as one faction</h2><p class="big weak">They share no concept, so they can't be one faction (step 6).</p>`;
  const syn=[];for(let i=0;i<t.all.length;i++)for(let j=i+1;j<t.all.length;j++){const l=linkOf[[t.all[i],t.all[j]].sort().join('|')];if(strong(l))syn.push(l)}
  syn.sort((x,y)=>(+y.cards||0)-(+x.cards||0));
  return `<h2>The two as one faction</h2><p class="big">Score <b>${t.score.toFixed(2)}</b> · number ${rank} of ${ALLPAIRS.length} pairs · ${t.all.length} concepts · ${t.n} strong links between the two · they share ${t.shared.map(c=>esc(short(c))).join(', ')}</p>
  <div class="chips">${t.all.map(c=>`<span class="chip">${esc(short(c))}</span>`).join('')}${marks([a,b])}</div><h3>Its synergies (${syn.length})</h3>${table(syn,false)}`}
function bestPairs(){const ps=[];for(let i=0;i<picked.length;i++)for(let j=i+1;j<picked.length;j++){const t=together(picked[i],picked[j]);
    ps.push([picked[i],picked[j],t.shared.length?t.score:0,t.shared.length?ALLPAIRS.findIndex(s=>s<=t.score)+1:'shares nothing'])}
  ps.sort((x,y)=>y[2]-x[2]);
  return `<h2>Which two fit best as one faction</h2><table><tr><th>the two archetypes</th><th>score</th><th>rank of ${ALLPAIRS.length}</th></tr>${ps.map(([a,b,s,r])=>`<tr><td>${esc(D.archetypes[a].name)}<br>${esc(D.archetypes[b].name)}</td><td>${s.toFixed(2)}</td><td>${r}</td></tr>`).join('')}</table>
  <p class="help">Untick the others to see one pair as a faction.</p>`}
function pickKind(c){const R={kernel:3,engine:2,brick:1,extra:0};let k=null;
  picked.forEach(a=>D.archetypes[a].parts.forEach(p=>{if(p.concepts.includes(c)&&(k===null||R[p.kind]>R[k]))k=p.kind}));return k||'clicked'}
function built(){const S=[...new Set([...picked.flatMap(conc),...chosen])];if(!S.length)return '';
  const idx=S.map(c=>D.nodes.indexOf(c)),need=Math.ceil(S.length/2);
  const fit=D.decks.filter(d=>idx.filter(i=>d[2].includes(i)).length>=need),games={};
  fit.forEach(d=>games[d[0]]=(games[d[0]]||0)+1);
  const share=(ds,i)=>ds.length?ds.filter(d=>d[2].includes(i)).length/ds.length:0;
  const more=D.nodes.map((c,i)=>[c,share(fit,i),share(D.decks,i)]).filter(x=>!S.includes(x[0])&&x[1]>x[2]).sort((x,y)=>y[1]-x[1]).slice(0,8);
  const sum=(o,cs)=>cs.reduce((t,c)=>t+(o[c]||0),0),tot=o=>Object.values(o).reduce((t,v)=>t+v,0);
  const facs=D.factions.map(([g,f,cn])=>{const gc=D.gameCounts[g],gs=sum(gc,S)/tot(gc);return [g,f,gs?(sum(cn,S)/tot(cn))/gs:0]}).sort((x,y)=>y[2]-x[2]);
  const fits=facs.filter(x=>x[2]>=2),like=keys.map(k=>[k,conc(k).filter(c=>S.includes(c)).length]).filter(x=>x[1]).sort((x,y)=>y[1]-x[1]).slice(0,3);
  const ng=Object.keys(games).length;
  return `<h2>Your pick: everything ticked and clicked</h2><div class="chips">${S.map(c=>`<span class="chip ${pickKind(c)}">${esc(short(c))}</span>`).join('')}</div>
  <p class="big"><b>Decks:</b> ${fit.length} of ${D.decks.length}, in ${ng} game${ng===1?'':'s'}${ng?' ('+Object.entries(games).sort((x,y)=>y[1]-x[1]).map(([g,n])=>esc(g)+' '+n).join(', ')+')':''}${ng<2?' <span class="weak">· an archetype needs 2+ games</span>':''}</p>
  <p class="big"><b>Factions that fit:</b> ${(fits.length?fits:facs.slice(0,3)).map(([g,f,r])=>esc(f)+' <span class="note">'+esc(g)+' ×'+r.toFixed(1)+'</span>').join(', ')}${fits.length?'':' <span class="note">(nearest; none fits)</span>'}</p>
  <p class="big"><b>Closest agreed archetypes:</b> ${like.map(([k,n])=>esc(D.archetypes[k].name)+' <span class="note">'+n+' shared</span>').join(', ')||'none'}</p>
  <h3>Those decks also lean on</h3><table><tr><th>concept</th><th>these decks</th><th>all decks</th></tr>${more.map(([c,a,b])=>`<tr><td>${esc(short(c))}</td><td>${Math.round(a*100)}%</td><td>${Math.round(b*100)}%</td></tr>`).join('')||'<tr><td colspan="3">none</td></tr>'}</table>`}
const HOW=`<details style="margin-top:16px"><summary>How to read this page</summary><ul class="help" style="padding-left:16px">
<li>Tick factions or deck groups to light them; click a dot to add or take out one concept (purple ring). Everything ticked and clicked is shown together as one pick, with the decks that play it.</li>
<li>A faction (step 6): red is its kernel, blue its engines, grey its bricks, dashed its extras; its lines are the strong links between its kernel and engines; two ticked factions show the links between them in orange.</li>
<li>Blue concepts are engines (they work by feeding another part of the archetype), grey are bricks (they work alone). Claude chose which is which.</li>
<li>Brown tags are design markers: what the archetype's decks are like (many spells, cheap units, a low curve). They are no concepts and take no faction place; later steps get them.</li>
<li><b>× chance</b>: how many times more often than chance real cards link the two (cards) or real decks hold both (decks). <b>games</b>: in how many of the 10 games such cards exist.</li>
<li>Thicker line = more times chance. Dashed = weak: its main link is about hitting the player, or only real decks hold them. An orange ring: a concept two ticked archetypes share.</li>
<li>Two archetypes can be one faction only when they share at least one concept. <b>Score</b> of two archetypes: strong links between a concept of one and a concept of the other, divided by their different concepts (step 6). A strong link: cards 1.2+, or a rare pairing of 3+.</li>
<li><b>Your pick</b>: a deck counts when it leans on at least half of the picked concepts (the half is Claude's); a deck leans on a concept when it holds it far more than its game's decks do (step 3). A faction fits when its cards hold the concepts at least twice as much as its game's cards (step 3's rule).</li>
<li>The places: two concepts sit close when the same archetypes' decks lean on them (Claude's way of measuring it).</li></ul></details>`;

draw();
</script></body></html>
