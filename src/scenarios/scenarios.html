<script>
/* =====================================================================
   SCENARIOS (three-bases-scenarios.html only): ready boards to try the resolution rules.
   Each board starts a test game (unlimited supply, the opponent only passes) with the units and hand below.
   Units: [card, side (0 you, 1 enemy), lane, row, column, orientation, extra fields]. Your front row is row 0; the enemy's is row 2.
   ===================================================================== */
const SCENARIOS = [
  { title: 'Horologers: the gear train', hand: ['c_key'],
    text: 'Cast Turn the Key on the left Cog Soldier (lane 1). It is wound: its round-end strike happens now. It is Geared, so the Geared Cog Soldier touching it is wound too, and that one winds the third: all three strike now, during the round.',
    units: [['c_cogsoldier', 0, 0, 0, 0], ['c_cogsoldier', 0, 0, 0, 1], ['c_cogsoldier', 0, 0, 0, 2], ['a_chest', 1, 0, 2, 0], ['a_chest', 1, 0, 2, 1], ['a_chest', 1, 0, 2, 2]] },
  { title: 'Horologers: the Perpetual Engine', hand: ['c_perpetual'],
    text: 'Place the Perpetual Engine (2x2) in lane 2, in the two back rows. Its Place winds every other ally there: the Bell Ringer and the Cog Soldier act now. Then pass: at round end they act, and the Engine winds them once more, so they act twice.',
    units: [['c_bellboy', 0, 1, 0, 0], ['c_cogsoldier', 0, 1, 0, 1], ['c_ticker', 0, 1, 0, 2], ['a_greatinduna', 1, 1, 2, 0], ['a_greatinduna', 1, 1, 2, 1], ['a_greatinduna', 1, 1, 2, 2]] },
  { title: 'Sunfeeders: an offering on the temple steps', hand: ['d_altarpriest'],
    text: 'Place the Altar Priest in lane 1, front row, middle, directly in front of the Willing Victim. The Victim is offered: it dies (its supply goes to your carry-over), and its Death deals 2 damage to the enemy facing it. Because an ally was offered, the Priest deals 4 more damage to the enemy facing it.',
    units: [['d_victim', 0, 0, 1, 1], ['a_chest', 1, 0, 2, 1]] },
  { title: 'Sunfeeders: the great day', hand: ['d_rain', 'd_suneater'],
    text: 'Cast Rain of Obsidian on lane 2: the three enemy Saplings (0|1) die. Three units died this round, so the Drummer of the Dead has +3 strength (Toll). Then place The Sun-Eater in your back rows: its Place deals 1 damage to each enemy for each death this round (3), which kills the Chest Warrior behind them.',
    units: [['d_drummer', 0, 1, 0, 1], ['o_sapling', 1, 1, 2, 0], ['o_sapling', 1, 1, 2, 1], ['o_sapling', 1, 1, 2, 2], ['a_chest', 1, 1, 1, 1]] },
  { title: 'Impi: the wave', hand: ['a_induna2'],
    text: 'Place the Wave Leader in lane 1, back row: your units there gain +1 strength this round. Attack with the Horn Warrior: both Young Runners gain +1 strength (Onrush). Attack with each Runner in turn: every attack makes the others stronger still.',
    units: [['a_runner', 0, 0, 0, 0], ['a_runner', 0, 0, 0, 1], ['a_hornwarrior', 0, 0, 0, 2], ['b_bastionguard', 1, 0, 2, 0], ['b_bastionguard', 1, 0, 2, 1], ['b_bastionguard', 1, 0, 2, 2]] },
  { title: 'Impi: the closing horns', hand: ['a_closinghorns'],
    text: 'Place The Closing Horns in lane 3, front row, middle. Its Place makes the Horn Warrior and the Horn Runner in the side columns strike (each has +2 strength there: Flanker), and then it strikes too.',
    units: [['a_hornwarrior', 0, 2, 0, 0], ['a_hornrunner', 0, 2, 0, 2], ['a_chest', 1, 2, 2, 0], ['a_chest', 1, 2, 2, 1], ['a_chest', 1, 2, 2, 2]] },
  { title: 'Hospice Knights: the Grand Master', hand: ['b_grandmaster'],
    text: 'Your knights in lane 1 have lost shields. Place The Grand Master behind them: each wounded ally gains +1|+1, then every ally there restores all its shields. Hold the base and the others have +1|+1 more.',
    units: [['b_knight', 0, 0, 0, 0, 'h', { dmg: 1 }], ['b_sergeant', 0, 0, 0, 1, 'h', { dmg: 2 }], ['b_shieldbro', 0, 0, 0, 2], ['a_chest', 1, 0, 2, 1]] },
  { title: 'Hospice Knights: the Avenger', hand: ['b_avenger2'],
    text: 'Your units in lane 2 have lost 5 shields between them. Place the Avenger of the Order: it deals damage equal to the shields lost (5) to the strongest enemy there.',
    units: [['b_bastion', 0, 1, 0, 0, 'h', { dmg: 3 }], ['b_squire', 0, 1, 0, 2, 'h', { pd: 2, dmg: 2 }], ['a_kingspear', 1, 1, 2, 1], ['b_lay', 1, 1, 2, 0]] },
  { title: 'Star Priests: every omen at once', hand: ['s_moonpriestess'],
    text: 'Place the High Priestess of the Moon in lane 1, back row. Her Place makes the Omen of each ally there happen: the Child of Omens and the Winged Bull Calf gain +1|+1, the Seal Bearer gains +2 defence, the Serpent Priest deals 2 damage to the enemy facing it.',
    units: [['s_omenchild', 0, 0, 0, 0], ['s_bullcalf', 0, 0, 0, 1], ['s_snakepriest', 0, 0, 0, 2], ['s_sealbearer', 0, 0, 1, 0], ['a_chest', 1, 0, 2, 2]] },
  { title: 'Star Priests: a night of signs', hand: ['s_starspark', 's_starspark', 's_starspark', 's_highastro'],
    text: 'Cast the three Star Sparks (0 supply each) on the Lay Brothers and the Great Induna in lane 2. Then place the High Astrologer: it deals 1 damage, +1 for each spell cast this round, to the strongest enemy there (4), and your Star Gazer adds 1 to each of those spells (Augur).',
    units: [['s_stargazer', 0, 1, 2, 1], ['a_greatinduna', 1, 1, 1, 1], ['b_lay', 1, 1, 2, 0], ['b_lay', 1, 1, 2, 2]] },
  { title: 'Rootkin: the King of Roots', hand: ['o_rootking'],
    text: 'Your Rootling, Rowan and Ash stand in lane 3. Place the King of Roots there: every one of your units with Roots strikes the enemy nearest the base in its column now, the King included.',
    units: [['o_rootling', 0, 2, 2, 0], ['o_rowan', 0, 2, 1, 1], ['o_ash', 0, 2, 1, 2], ['a_chest', 1, 2, 2, 0], ['a_chest', 1, 2, 1, 1], ['b_bastionguard', 1, 2, 2, 2]] },
  { title: 'Rootkin: the Eldest Oak', hand: ['o_eldest'],
    text: 'Three Saplings hold the front row of lane 1. Place The Eldest Oak (2x2) behind them: the Saplings gain +2|+2, then every other unit there gains +1|+1. At each round end the Saplings and the Oak grow again (Perennial).',
    units: [['o_sapling', 0, 0, 0, 0], ['o_sapling', 0, 0, 0, 1], ['o_sapling', 0, 0, 0, 2], ['a_chest', 1, 0, 2, 1]] },
  { title: 'The Long Guns: spot and strike', hand: ['l_observer'],
    text: 'Place the Forward Observer in lane 2, front row, middle: the enemy facing it is Marked. Then attack it with the Lewis Gunner (Ranged) from your back row: strikes on a Marked unit deal double damage.',
    units: [['l_lewis', 0, 1, 2, 0], ['a_greatinduna', 1, 1, 2, 1]] },
  { title: 'The Long Guns: the Great Howitzer', hand: ['l_howitzergreat'],
    text: 'Two enemies in lane 3 are Marked. Place The Great Howitzer (2x2) in your back rows: it deals 3 damage to each Marked enemy there. At round end its Barrage 3 hits the enemy furthest from the base.',
    units: [['l_infantry', 0, 2, 0, 0], ['l_infantry', 0, 2, 0, 1], ['a_greatinduna', 1, 2, 2, 0, 'h', { kw: { marked: 1 } }], ['a_chest', 1, 2, 1, 1, 'h', { kw: { marked: 1 } }], ['b_lay', 1, 2, 0, 2]] },
];

let scenAt = null, scenReady = false;
const waitFor = (test, ms = 10000) => new Promise((resolve, reject) => {
  const t0 = Date.now(), tick = () => { if (test()) resolve(); else if (Date.now() - t0 > ms) reject(new Error('timeout')); else setTimeout(tick, 60); };
  tick();
});
function renderScenarioPage() {
  $('#scenList').innerHTML = SCENARIOS.map((sc, i) => `<button class="scen" data-i="${i}"><b>${i + 1}. ${sc.title}</b><span>${sc.text}</span></button>`).join('');
}
function showScenarioPage() {
  $('#scenBar').hidden = true;
  $('#scenPage').hidden = false;
  renderScenarioPage();
}
/** Start a fresh test game and lay out scenario i. */
async function loadScenario(i) {
  const sc = SCENARIOS[i];
  scenAt = i; scenReady = false;
  $('#scenPage').hidden = true; $('#scenBar').hidden = true;
  settings.mode = 'ai'; aiChoice.kind = 'bench';
  setTestGames(true); setTestIdle(true);
  $('#endDlg').hidden = true; $('#replayBar').hidden = true;
  showPage('#setup'); renderHome();
  $('#setup').dataset.scen = '1';
  $('#startBtn').click();
  await waitFor(() => !$('#mull').hidden);
  $('#mullGo').click();
  // if the computer starts, let its pass go through first, so no move of its own is still on its way
  await waitFor(() => game && $('#mull').hidden && game.cur === 0 && !busy && !aiThinking, 15000);
  await sleep(400);
  const s = game;
  s.units = []; s.tombs = []; s.cur = 0; s.starter = 0; s.passed = null; s.pending = null; s.winner = null; s.round = 1; s.acts = 0;
  for (const [card, owner, lane, r, c, o, extra] of sc.units)
    s.units.push({ id: s.nid++, card, owner, lane, r, c, o: o || 'h', ps: 0, pd: 0, dmg: 0, mv: 0, born: 0, ...(extra || {}) });
  s.players[0].hand = sc.hand.slice();
  s.players[1].hand = [];
  s.players[0].discard = []; s.players[1].discard = [];
  applyAuras(s); updateBases(s); s.ownerStart = s.owner.slice();
  s.log = []; log(s, `Scenario: ${sc.title}.`);
  resetUi(); prevStats = new Map();
  $('#scenTitle').textContent = `${i + 1}. ${sc.title}`;
  $('#scenText').textContent = sc.text;
  $('#scenBar').hidden = false;
  scenReady = true;
  render();
}
document.addEventListener('DOMContentLoaded', () => {
  document.body.insertAdjacentHTML('beforeend', `
<div class="overlay page" id="scenPage"><div class="pagein">
  <header class="phead"><div><h1>Three Bases · scenarios</h1><p class="hint">Ready boards for the resolution rules. Supply is unlimited and the opponent only passes. Pick one to play it.</p></div></header>
  <div id="scenList"></div>
</div></div>
<aside id="scenBar" hidden><b id="scenTitle"></b><p id="scenText"></p><div class="sbtns"><button id="scenReset" class="go">Reset</button><button id="scenBack">All boards</button></div></aside>`);
  $('#scenList').addEventListener('click', e => { const b = e.target.closest('.scen'); if (b) loadScenario(+b.dataset.i); });
  $('#scenReset').addEventListener('click', () => { if (scenAt !== null) loadScenario(scenAt); });
  $('#scenBack').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); showScenarioPage(); });
  // the start page never shows here: whenever the game would return to it, the scenario list shows instead
  new MutationObserver(() => { if (!$('#setup').hidden && !$('#setup').dataset.scen) { $('#setup').hidden = true; showScenarioPage(); } delete $('#setup').dataset.scen; })
    .observe($('#setup'), { attributes: true, attributeFilter: ['hidden'] });
  $('#setup').hidden = true;
  $('#againBtn').textContent = 'Reset board';
  $('#againBtn').addEventListener('click', e => { e.stopImmediatePropagation(); $('#endDlg').hidden = true; if (scenAt !== null) loadScenario(scenAt); }, true);
  showScenarioPage();
});
</script>
